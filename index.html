<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9FAF2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11140F" media="(prefers-color-scheme: dark)">
  <title>Merge PDFs</title>
  <script src="./pdf-lib.min.js"></script>

  <style>
:root {
    --primary: var(--md-primary, #ACD299);
    --onPrimary: var(--md-onPrimary, #173807);
    --primaryContainer: var(--md-primaryContainer, #2F4F22);
    --onPrimaryContainer: var(--md-onPrimaryContainer, #C7EEB3);
    --secondary: var(--md-secondary, #BCCBB1);
    --onSecondary: var(--md-onSecondary, #283421);
    --secondaryContainer: var(--md-secondaryContainer, #3E4B37);
    --onSecondaryContainer: var(--md-onSecondaryContainer, #D8E7CC);
    --tertiary: var(--md-tertiary, #CFCB7E);
    --onTertiary: var(--md-onTertiary, #333100);
    --tertiaryContainer: var(--md-tertiaryContainer, #4B4811);
    --onTertiaryContainer: var(--md-onTertiaryContainer, #F9F4AE);
    --error: var(--md-error, #F2B8B5);
    --onError: var(--md-onError, #601410);
    --errorContainer: var(--md-errorContainer, #8C1D18);
    --onErrorContainer: var(--md-onErrorContainer, #F9DEDC);
    --surface: var(--md-surface, #11140F);
    --onSurface: var(--md-onSurface, #E2E3DA);
    --surfaceVariant: var(--md-surfaceVariant, #424940);
    --onSurfaceVariant: var(--md-onSurfaceVariant, #C2C8BC);
    --surfaceContainerLowest: var(--md-surfaceContainerLowest, #0C0F0A);
    --surfaceContainerLow: var(--md-surfaceContainerLow, #191D16);
    --surfaceContainer: var(--md-surfaceContainer, #1D211A);
    --surfaceContainerHigh: var(--md-surfaceContainerHigh, #272B24);
    --surfaceContainerHighest: var(--md-surfaceContainerHighest, #32362E);
    --surfaceDim: var(--md-surfaceDim, #11140F);
    --surfaceBright: var(--md-surfaceBright, #373B33);
    --outline: var(--md-outline, #8C9387);
    --outlineVariant: var(--md-outlineVariant, #424940);
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.35);
    --shadow-hi: 0 8px 28px rgba(0,0,0,.6);
    color-scheme: dark;
  }

    *,*::before,*::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }
    html,body {
      margin: 0;
      background: var(--surface);
      color: var(--onSurface);
      font: 400 16px/1.45 Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
      -webkit-user-select: none;
      user-select: none;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
      radial-gradient(520px 320px at 100% -4%, color-mix(in srgb, var(--tertiaryContainer) 75%, transparent), transparent 70%),
      radial-gradient(480px 360px at -8% 14%, color-mix(in srgb, var(--primaryContainer) 80%, transparent), transparent 70%);
    }
    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer
    }
    svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex: none
    }
:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px
    }

    /* state layer helper */
    .sl {
      position: relative;
      overflow: hidden
    }
    .sl::after {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity .15s;
      pointer-events: none
    }
    .sl:hover::after {
      opacity: .08
    }
    .sl:active::after {
      opacity: .14
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 16px 168px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 -16px 20px;
      padding: calc(var(--safe-area-inset-top, 0px) + 16px) 20px 14px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: var(--primary);
      color: var(--onPrimary);
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 5px var(--primaryContainer), var(--shadow);
      margin-right: 4px;
    }
    .logo svg {
      width: 30px;
      height: 30px
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -.3px;
      color: var(--onPrimaryContainer)
    }
    header p {
      margin: 2px 0 0;
      color: var(--onSurfaceVariant);
      font-size: 14px
    }

    .drop {
      display: block;
      position: relative;
      border-radius: 32px;
      background: var(--primaryContainer);
      color: var(--onPrimaryContainer);
      border: 2px dashed color-mix(in srgb, var(--primary) 60%, transparent);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s, border-radius .25s;
      overflow: hidden;
    }
    .drop::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -60px;
      top: -70px;
      border-radius: 50%;
      background: var(--tertiaryContainer);
      opacity: .7;
      pointer-events: none;
    }
    .drop > * {
      position: relative
    }
    .drop:hover, .drop.over {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primaryContainer) 85%, var(--primary));
      border-radius: 40px
    }
    .drop:active {
      transform: scale(.985)
    }
    .drop input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }
    .drop .plus {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 24px;
      background: var(--primary);
      color: var(--onPrimary);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }
    .drop .plus svg {
      width: 32px;
      height: 32px
    }
    .drop b {
      display: block;
      font-weight: 600;
      font-size: 18px
    }
    .drop span {
      color: color-mix(in srgb, var(--onPrimaryContainer) 78%, transparent);
      font-size: 14px
    }
    .compact {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      padding: 14px 18px;
      border-radius: 28px
    }
    .compact::before {
      width: 120px;
      height: 120px;
      right: -40px;
      top: -50px
    }
    .compact .plus {
      margin: 0;
      width: 44px;
      height: 44px;
      border-radius: 16px
    }
    .compact .plus svg {
      width: 24px;
      height: 24px
    }
    .compact b {
      font-size: 16px
    }

    .sec {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 28px 4px 12px
    }
    .sec h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--onSurface)
    }
    .sec small {
      display: block;
      color: var(--onSurfaceVariant);
      font-size: 13px;
      margin-top: 1px
    }
    .txt {
      color: var(--onSecondaryContainer);
      background: var(--secondaryContainer);
      font-weight: 500;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }
    .txt:hover {
      box-shadow: var(--shadow)
    }

    #list {
      display: flex;
      flex-direction: column;
      gap: 10px
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 6px 10px 10px;
      background: var(--surfaceContainerHigh);
      border-radius: 26px;
      border: 1.5px solid transparent;
      transition: box-shadow .2s, transform .2s, border-color .2s, background .2s;
      animation: in .3s ease both;
    }
    .item:nth-child(3n+2) {
      background: color-mix(in srgb, var(--secondaryContainer) 55%, var(--surfaceContainerHigh))
    }
    .item:nth-child(3n) {
      background: color-mix(in srgb, var(--tertiaryContainer) 45%, var(--surfaceContainerHigh))
    }
    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }
    .item.drag {
      background: var(--primaryContainer);
      border-color: var(--primary);
      transform: scale(1.025);
      box-shadow: var(--shadow-hi);
      z-index: 3;
      position: relative;
    }
    .item.bad {
      background: var(--errorContainer);
      border-color: color-mix(in srgb, var(--error) 55%, transparent)
    }
    .idx {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--onPrimary);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 600;
      flex: none;
    }
    .item.drag .idx {
      background: var(--tertiary);
      color: var(--onTertiary)
    }
    .item.bad .idx {
      background: var(--error);
      color: var(--onError)
    }
    .ico {
      width: 44px;
      height: 52px;
      border-radius: 12px;
      background: var(--tertiaryContainer);
      color: var(--onTertiaryContainer);
      display: grid;
      place-items: center;
      position: relative;
      flex: none;
      overflow: hidden;
    }
    .ico::after {
      content: "PDF";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--tertiary);
      color: var(--onTertiary);
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      line-height: 14px;
      letter-spacing: .5px;
    }
    .item.bad .ico {
      background: var(--surface);
      color: var(--error)
    }
    .item.bad .ico::after {
      background: var(--error);
      color: var(--onError)
    }
    .ico svg {
      width: 22px;
      height: 22px;
      margin-bottom: 12px
    }
    .info {
      flex: 1;
      min-width: 0
    }
    .name {
      font-weight: 500;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }
    .meta {
      color: var(--onSurfaceVariant);
      font-size: 13px
    }
    .bad .meta, .bad .name {
      color: var(--onErrorContainer)
    }
    .ib {
      width: 40px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--onSurfaceVariant);
      transition: background .2s, color .2s;
      flex: none;
    }
    .ib:hover {
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--onSurface)
    }
    button.ib:hover {
      background: var(--errorContainer);
      color: var(--onErrorContainer)
    }
    .grip {
      touch-action: none;
      cursor: grab;
      width: 36px
    }
    .drag .grip {
      cursor: grabbing;
      color: var(--primary)
    }
    .spin {
      width: 18px;
      height: 18px;
      border: 2.5px solid var(--secondaryContainer);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: r .8s linear infinite;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 6px;
    }
    @keyframes r {
      to {
        transform: rotate(360deg)
      }
    }
    .hint {
      color: var(--onSurfaceVariant);
      font-size: 13px;
      text-align: center;
      margin-top: 14px
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      padding: 16px 16px calc(16px + var(--safe-area-inset-bottom, 0px));
      background: color-mix(in srgb, var(--secondaryContainer) 92%, transparent);
      color: var(--onSecondaryContainer);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 32px 32px 0 0;
      box-shadow: 0 -6px 24px rgba(40,60,30,.16);
      transform: translateY(110%);
      transition: transform .35s cubic-bezier(.2,.8,.2,1), background .25s;
    }
    .bar.show {
      transform: none
    }
    .bar.err {
      background: color-mix(in srgb, var(--errorContainer) 94%, transparent);
      color: var(--onErrorContainer)
    }
    .bar-in {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px
    }
    .sum {
      flex: 1;
      min-width: 0
    }
    .sum b {
      font-weight: 600;
      font-size: 16px
    }
    .sum b, .sum span {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }
    .sum span {
      color: inherit;
      opacity: .78;
      font-size: 13px
    }
    .fab {
      position: relative;
      overflow: hidden;
      height: 56px;
      padding: 0 26px 0 20px;
      border-radius: 20px;
      background: var(--primary);
      color: var(--onPrimary);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
      transition: transform .15s, opacity .2s, box-shadow .2s, border-radius .2s;
      box-shadow: var(--shadow);
    }
    .fab::after {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity .15s
    }
    .fab:hover:not(:disabled)::after {
      opacity: .1
    }
    .fab:hover:not(:disabled) {
      box-shadow: var(--shadow-hi);
      border-radius: 28px
    }
    .fab:active {
      transform: scale(.96)
    }
    .fab:disabled {
      opacity: .38;
      box-shadow: none;
      cursor: not-allowed;
      background: var(--outline);
      color: var(--surface)
    }
    .bar:has(.fab.dl) .fab {
      background: var(--tertiary);
      color: var(--onTertiary)
    }

    .prog {
      display: none;
      margin-top: 8px
    }
    .busy .prog {
      display: block
    }
    .track {
      height: 8px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--primary) 22%, transparent);
      overflow: hidden
    }
    .fill {
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--primary), var(--tertiary));
      transition: width .45s cubic-bezier(.3,.7,.2,1);
      position: relative;
      overflow: hidden;
    }
    .fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
      transform: translateX(-100%);
      animation: sh 1.3s infinite;
    }
    @keyframes sh {
      to {
        transform: translateX(100%)
      }
    }
    .bar.err .sum b {
      color: var(--error)
    }
    .fab .spin {
      border-color: color-mix(in srgb, var(--onPrimary) 30%, transparent);
      border-top-color: var(--onPrimary);
      margin: 0
    }

    /* about */
    .about {
      margin: 24px auto 0;
      max-width: 640px;
      padding: 0 0 calc(32px + var(--safe-area-inset-bottom, 0px));
      text-align: center
    }
    .about .card {
      background: var(--tertiaryContainer);
      color: var(--onTertiaryContainer);
      border-radius: 32px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .about p {
      margin: 0;
      font-size: 15px
    }
    .about p b {
      font-weight: 700
    }
    .about .heart {
      display: inline-block;
      color: var(--error);
      animation: beat 1s ease-in-out infinite
    }
    @keyframes beat {
      0%,60%,100% {
        transform: scale(1)
      }

      30% {
        transform: scale(1.35)
      }
    }
    .about a.btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--tertiary);
      color: var(--onTertiary);
      text-decoration: none;
      font-weight: 600;
      box-shadow: var(--shadow);
    }
    .about a.btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity .15s
    }
    .about a.btn:hover::after {
      opacity: .1
    }
    .about a.btn:active::after {
      opacity: .16
    }
    .about svg {
      width: 20px;
      height: 20px;
      fill: currentColor
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>
<body>
  <svg style="display:none">
    <symbol id="i-merge" viewBox="0 0 24 24"><path d="M17 20.41 18.41 19 15 15.59 13.59 17 17 20.41zM7.5 8H11v5.59L5.59 19 7 20.41l6-6V8h3.5L12 3.5 7.5 8z" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z" /></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm6 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM9 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm6 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM9 16a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm6 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" /></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" /></symbol>
    <symbol id="i-dl" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z" /></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" /></symbol>
  </svg>

  <main class="app">
    <header>
      <div class="logo">
        <svg><use href="#i-merge" /></svg>
      </div>
      <div>
        <h1>Merge PDFs</h1><p>
          Combine files into one, right on this device
        </p>
      </div>
    </header>

    <label class="drop" id="drop">
      <input id="pick" type="file" accept="application/pdf,.pdf" multiple>
      <div class="plus">
        <svg><use href="#i-plus" /></svg>
      </div>
      <b>Select PDF files</b>
      <span>Tap to browse, or drop files here</span>
    </label>

    <section id="listWrap" hidden>
      <div class="sec">
        <div>
          <h2>Merge order</h2><small>Drag the handle to reorder</small>
        </div>
        <button class="txt sl" id="clear">Clear all</button>
      </div>
      <div id="list"></div>
      <p class="hint">
        Files are merged top to bottom. Nothing leaves your device.
      </p>
    </section>

    <footer class="about">
      <div class="card">
        <p>
          Made with <span class="heart" aria-label="love">❤️‍🔥</span> by <b>BR1JM0H4N</b>
        </p>
        <p>
          PDF merge is open source. Stars, ideas and bug reports are welcome!
        </p>
        <a class="btn" href="https://github.com/BR1JM0H4N/Pdf-Merge" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" /></svg>
          View on GitHub
        </a>
      </div>
    </footer>


  </main>

  <div class="bar" id="bar">
    <div class="bar-in">
      <div class="sum">
        <b id="sumA"></b><span id="sumB"></span><div class="prog">
          <div class="track">
            <div class="fill" id="fill"></div>
          </div>
        </div>
      </div>
      <button class="fab" id="go"><svg><use href="#i-merge" /></svg>Merge</button>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const list = $('#list'), bar = $('#bar');
    let files = [], uid = 0, run = 0, busy = false, outBlob = null, outName = '', err = '';

    const fmt = b => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB': (b / 1048576).toFixed(1) + ' MB';
    const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot; '}[c]));
      const tick = () => new Promise(r => setTimeout(r, 60));
      const ok = () => files.filter(f => f.pages);
      function invalidate() {
        run++; busy = false; outBlob = null; err = ''; bar.classList.remove('busy');
      }

      async function addFiles(fl) {
        const pdfs = [...fl].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
        for (const f of pdfs) {
          const it = {
            id: ++uid,
            file: f,
            pages: null,
            err: null,
            loading: true
          };
          invalidate(); files.push(it); render();
          try {
            const d = await PDFLib.PDFDocument.load(await f.arrayBuffer());
            it.pages = d.getPageCount();
          } catch (x) {
            it.err = /encrypt/i.test(x.message) ? 'Password protected, can’t merge': 'Can’t read this file';
          }
          it.loading = false; render();
        }
      }
      $('#pick').onchange = e => {
        const l = e.target.files; addFiles(l); setTimeout(() => e.target.value = '', 0);
      };
      const drop = $('#drop');
      ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => {
        e.preventDefault(); drop.classList.add('over');
      }));
      ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => {
        e.preventDefault(); drop.classList.remove('over');
      }));
      drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

      function render() {
        $('#listWrap').hidden = !files.length;
        drop.classList.toggle('compact', !!files.length);
        drop.querySelector('b').textContent = files.length ? 'Add more PDFs': 'Select PDF files';
        drop.querySelector('span').hidden = !!files.length;
        list.innerHTML = files.map((f, i) => `
          <div class="item${f.err ? ' bad': ''}" data-id="${f.id}">
          <div class="idx">${f.err ? '!': i + 1}</div>
          <div class="ico"><svg><use href="#i-doc"/></svg></div>
          <div class="info">
          <div class="name">${esc(f.file.name)}</div>
          <div class="meta">${f.loading ? '<i class="spin"></i>Reading…': f.err ? esc(f.err): f.pages + (f.pages === 1 ? ' page': ' pages') + ' • ' + fmt(f.file.size)}</div>
          </div>
          <button class="ib" data-rm="${f.id}" aria-label="Remove ${esc(f.file.name)}"><svg><use href="#i-x"/></svg></button>
          <div class="ib grip" aria-label="Drag to reorder"><svg><use href="#i-grip"/></svg></div>
          </div>`).join('');
        const g = ok(),
        pages = g.reduce((a, f) => a + f.pages, 0),
        size = g.reduce((a, f) => a + f.file.size, 0);
        const go = $('#go'),
        ready = !!outBlob;
        bar.classList.toggle('err', !!err && !busy);
        if (!busy) {
          if (ready) {
            $('#sumA').textContent = 'Merged • ' + pages + ' pages'; $('#sumB').textContent = outName + ' • ' + fmt(outBlob.size);
          } else if (err) {
            $('#sumA').textContent = 'Merge failed'; $('#sumB').textContent = err;
          } else {
            $('#sumA').textContent = g.length ? g.length + (g.length === 1 ? ' file': ' files') + ' • ' + pages + ' pages': 'No valid files';
            $('#sumB').textContent = g.length < 2 ? 'Add at least 2 PDFs to merge': 'About ' + fmt(size) + ' combined';
          }
        }
        go.classList.toggle('dl', ready);
        go.innerHTML = busy ? '<i class="spin"></i>Merging': ready ? '<svg><use href="#i-dl"/></svg>Download': '<svg><use href="#i-merge"/></svg>Merge';
        go.disabled = busy || (!ready && (g.length < 2 || files.some(f => f.loading)));
        bar.classList.toggle('show', files.length > 0);
      }

      list.addEventListener('click', e => {
        const b = e.target.closest('[data-rm]');
        if (b) {
          invalidate(); files = files.filter(f => f.id !== +b.dataset.rm); render();
        }
      });
      $('#clear').onclick = () => {
        invalidate(); files = []; render();
      };

      list.addEventListener('pointerdown', e => {
        const h = e.target.closest('.grip');
        if (!h) return;
        e.preventDefault();
        const el = h.closest('.item');
        el.classList.add('drag');
        if (navigator.vibrate) navigator.vibrate(10);
        const mv = ev => {
          const y = ev.clientY,
          p = el.previousElementSibling,
          n = el.nextElementSibling;
          if (p) {
            const r = p.getBoundingClientRect(); if (y < r.top + r.height / 2) list.insertBefore(el, p);
          }
          if (n) {
            const r = n.getBoundingClientRect(); if (y > r.top + r.height / 2) list.insertBefore(n, el);
          }
          if (y > innerHeight - 150) scrollBy(0, 10); else if (y < 90) scrollBy(0, -10);
        };
        const up = () => {
          removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
          const order = [...list.children].map(c => +c.dataset.id);
          if (order.join() !== files.map(f => f.id).join()) invalidate();
          files.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
          render();
        };
        addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
      });

      function setP(pct, a, b) {
        $('#fill').style.width = pct + '%';
        $('#sumA').textContent = a + ' • ' + Math.round(pct) + '%';
        $('#sumB').textContent = b;
      }
      function download() {
        if (!outBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(outBlob); a.download = outName;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }

      async function merge() {
        const use = ok();
        if (use.length < 2 || busy) return;
        const my = ++run; busy = true; outBlob = null; err = '';
        $('#fill').style.width = '0%';
        bar.classList.remove('err'); bar.classList.add('busy'); render();
        setP(0, 'Merging', 'Getting started');
        await tick();
        try {
          const out = await PDFLib.PDFDocument.create();
          let done = 0; const total = use.reduce((a, f) => a + f.pages, 0);
          for (let i = 0; i < use.length; i++) {
            const f = use[i];
            setP(done / total * 92, 'Merging', 'File ' + (i + 1) + ' of ' + use.length + ' • ' + f.file.name);
            await tick();
            const src = await PDFLib.PDFDocument.load(await f.file.arrayBuffer());
            const pages = await out.copyPages(src, src.getPageIndices());
            if (my !== run) return;
            pages.forEach(p => out.addPage(p));
            done += f.pages;
          }
          setP(95, 'Saving', 'Building the final file');
          await tick();
          const bytes = await out.save();
          if (my !== run) return;
          const d = new Date(),
          z = n => String(n).padStart(2, '0');
          outName = 'merged-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + '.pdf';
          outBlob = new Blob([bytes], {
            type: 'application/pdf'
          });
          busy = false; bar.classList.remove('busy'); render();
          download();
        } catch (x) {
          if (my !== run) return;
          busy = false; err = x.message || 'Try fewer or smaller files'; bar.classList.remove('busy'); render();
        }
      }
      $('#go').onclick = () => outBlob ? download(): merge();
      render();
    </script>
    </body>
  </html>
